[project]
name = "kitai"
version = "0.2.0"
description = "RAG toolkit: vector index, BM25, hybrid retrieval, query translation, and OpenAI Batch API helpers."
authors = [{ name = "Luigi", email = "luigi@example.com" }]
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "openai>=1.0",
    "pydantic>=2.0",
    "langchain-core>=0.1",
    "langchain-community>=0.0.20",
    # Classic LangChain (retrievers, self-query, ensemble).
    # Published on PyPI as 'langchain-classic'. kitai.retriever imports
    # directly from this package — no fallback to the Anthropic SDK.
    "langchain-classic>=1.0",
    "faiss-cpu>=1.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["kitai*"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
